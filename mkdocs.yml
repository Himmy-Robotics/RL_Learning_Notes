site_name: RL Learning Notes
site_description: Reinforcement learning math notes.
site_url: https://himmy-robotics.github.io/RL_Learning_Notes/
repo_url: https://github.com/Himmy-Robotics/RL_Learning_Notes
repo_name: Himmy-Robotics/RL_Learning_Notes

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - navigation.sections
    - toc.integrate
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 1. Basic Concepts: 01-basic-concepts.md
  - 2. State-Value, Action-Value and Bellman Equation: 02-value-bellman.md
  - 3. Optimal State Values and Bellman Optimality Equation: 03-optimal-bellman.md
  - 4. Value Iteration and Policy Iteration: 04-value-policy-iteration.md
  - 5. Monte Carlo Methods: 05-monte-carlo.md
  - 6. Stochastic Approximation: 06-stochastic-approximation.md
  - 7. Temporal-Difference Methods: 07-td-methods.md
  - 8. Value Function Approximation: 08-function-approximation.md
  - 9. Policy Gradient Methods: 09-policy-gradient.md
  - 10. Actor-Critic Methods: 10-actor-critic.md
  - 11. PPO: 11-ppo.md
